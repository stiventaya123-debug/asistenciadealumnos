<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CETPRO SAN PEDRO DE APLAO - Marcar Asistencia</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Encabezado -->
    <header class="w-full bg-slate-800 border-b border-slate-700 py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-white shadow-md shadow-emerald-500/20">
                    <i class="fa-solid fa-clipboard-user"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white">CETPRO SAN PEDRO DE APLAO</h1>
                    <p class="text-xs text-emerald-400">Control de Asistencia Diario</p>
                </div>
            </div>
            <a href="index.html" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg flex items-center gap-2 transition">
                <i class="fa-solid fa-house"></i> Volver al Inicio
            </a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl space-y-6">
            
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl mx-auto mb-2">
                    <i class="fa-solid fa-id-card"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Marcar Asistencia</h2>
                <p class="text-xs text-slate-400">Ingrese el DNI para consultar y marcar la asistencia de hoy.</p>
            </div>

            <!-- Caja de Mensajes -->
            <div id="mensajeBox" class="hidden p-4 rounded-xl text-xs font-medium border"></div>

            <!-- Formulario de Búsqueda -->
            <form id="buscarForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">DNI del Estudiante (8 dígitos)</label>
                    <div class="flex gap-2">
                        <input type="text" id="dniSearch" maxlength="8" pattern="[0-9]{8}" placeholder="Ej. 73829102" required 
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 font-mono tracking-wider">
                        <button type="submit" id="btnBuscar" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 rounded-lg text-sm font-medium transition flex items-center gap-2 shrink-0">
                            <i class="fa-solid fa-magnifying-glass"></i> Buscar
                        </button>
                    </div>
                </div>
            </form>

            <!-- Tarjeta del Estudiante -->
            <div id="estudianteCard" class="hidden bg-slate-900/80 border border-slate-700 p-5 rounded-xl space-y-4">
                <div class="border-b border-slate-800 pb-3">
                    <span class="text-[10px] uppercase font-semibold text-emerald-400 tracking-wider">Estudiante Encontrado</span>
                    <h3 id="estudianteNombre" class="text-base font-bold text-white mt-1">---</h3>
                    <p id="estudiantePrograma" class="text-xs text-slate-400">---</p>
                </div>

                <div class="flex justify-between items-center text-xs text-slate-300 bg-slate-800/60 p-3 rounded-lg border border-slate-700/50">
                    <div>
                        <p class="text-[10px] text-slate-400">Fecha de Hoy:</p>
                        <p id="fechaHoyText" class="font-semibold text-white">---</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-slate-400">Hora Actual:</p>
                        <p id="horaHoyText" class="font-semibold text-emerald-400 font-mono">---</p>
                    </div>
                </div>

                <button id="btnConfirmarAsistencia" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg text-sm transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check-double"></i> Confirmar Marcación
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-slate-950 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-400">
        <p>&copy; CETPRO SAN PEDRO DE APLAO - Todos los derechos reservados.</p>
    </footer>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONEXIÓN A FIREBASE REAL
        const firebaseConfig = {
            apiKey: "AIzaSyAMAVmKSb8Tygvd3NycZMrBj86GN9h4-j4",
            authDomain: "registro-personas-c5e48.firebaseapp.com",
            projectId: "registro-personas-c5e48",
            storageBucket: "registro-personas-c5e48.firebasestorage.app",
            messagingSenderId: "129443873783",
            appId: "1:129443873783:web:9d4575e9ea54ba208e24f2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const buscarForm = document.getElementById('buscarForm');
        const dniSearch = document.getElementById('dniSearch');
        const btnBuscar = document.getElementById('btnBuscar');
        const mensajeBox = document.getElementById('mensajeBox');
        
        const estudianteCard = document.getElementById('estudianteCard');
        const estudianteNombre = document.getElementById('estudianteNombre');
        const estudiantePrograma = document.getElementById('estudiantePrograma');
        const fechaHoyText = document.getElementById('fechaHoyText');
        const horaHoyText = document.getElementById('horaHoyText');
        const btnConfirmarAsistencia = document.getElementById('btnConfirmarAsistencia');

        let estudianteActual = null;
        let fechaActualClave = '';

        function mostrarMensaje(texto, tipo) {
            mensajeBox.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400', 'bg-amber-500/10', 'border-amber-500/30', 'text-amber-400');
            
            if (tipo === 'error') {
                mensajeBox.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
            } else if (tipo === 'advertencia') {
                mensajeBox.classList.add('bg-amber-500/10', 'border-amber-500/30', 'text-amber-400');
            } else {
                mensajeBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
            }
            mensajeBox.innerHTML = texto;
        }

        function ocultarMensaje() {
            mensajeBox.classList.add('hidden');
        }

        function obtenerFechaClave(ahora) {
            const anio = ahora.getFullYear();
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const dia = String(ahora.getDate()).padStart(2, '0');
            return `${anio}-${mes}-${dia}`;
        }

        // Buscar Estudiante
        buscarForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            ocultarMensaje();
            estudianteCard.classList.add('hidden');

            const dni = dniSearch.value.trim();

            if (!/^\d{8}$/.test(dni)) {
                mostrarMensaje('<i class="fa-solid fa-circle-exclamation"></i> Ingrese un DNI válido de 8 dígitos.', 'error');
                return;
            }

            try {
                btnBuscar.disabled = true;
                btnBuscar.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i>';

                const estudianteRef = doc(db, "estudiantes", dni);
                const estudianteSnap = await getDoc(estudianteRef);

                if (!estudianteSnap.exists()) {
                    mostrarMensaje(`<i class="fa-solid fa-user-xmark"></i> El DNI <strong>${dni}</strong> no se encuentra registrado. Por favor verifique o regístrese primero.`, 'error');
                    btnBuscar.disabled = false;
                    btnBuscar.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Buscar';
                    return;
                }

                estudianteActual = estudianteSnap.data();

                const ahora = new Date();
                fechaActualClave = obtenerFechaClave(ahora);

                // Validar marcación doble en el mismo día
                const asistenciaId = `${dni}_${fechaActualClave}`;
                const asistenciaRef = doc(db, "asistencias", asistenciaId);
                const asistenciaSnap = await getDoc(asistenciaRef);

                if (asistenciaSnap.exists()) {
                    const datos = asistenciaSnap.data();
                    mostrarMensaje(`<i class="fa-solid fa-triangle-exclamation"></i> El estudiante <strong>${estudianteActual.nombres} ${estudianteActual.apellidos}</strong> ya registró su asistencia hoy (${datos.fecha}) a las <strong>${datos.hora}</strong>.`, 'advertencia');
                    btnBuscar.disabled = false;
                    btnBuscar.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Buscar';
                    return;
                }

                estudianteNombre.textContent = `${estudianteActual.nombres} ${estudianteActual.apellidos}`;
                estudiantePrograma.textContent = `Programa: ${estudianteActual.programa}`;
                fechaHoyText.textContent = ahora.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
                horaHoyText.textContent = ahora.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

                estudianteCard.classList.remove('hidden');

            } catch (error) {
                console.error("Error al buscar:", error);
                mostrarMensaje('<i class="fa-solid fa-circle-xmark"></i> Ocurrió un error al buscar el estudiante.', 'error');
            } finally {
                btnBuscar.disabled = false;
                btnBuscar.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Buscar';
            }
        });

        // Confirmar Marcación
        btnConfirmarAsistencia.addEventListener('click', async () => {
            if (!estudianteActual) return;

            try {
                btnConfirmarAsistencia.disabled = true;
                btnConfirmarAsistencia.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> Registrando...';

                const ahora = new Date();
                const fechaTexto = ahora.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const horaTexto = ahora.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

                const asistenciaId = `${estudianteActual.dni}_${fechaActualClave}`;
                const asistenciaRef = doc(db, "asistencias", asistenciaId);

                await setDoc(asistenciaRef, {
                    dni: estudianteActual.dni,
                    nombres: estudianteActual.nombres,
                    apellidos: estudianteActual.apellidos,
                    programa: estudianteActual.programa,
                    fechaClave: fechaActualClave,
                    fecha: fechaTexto,
                    hora: horaTexto,
                    timestamp: serverTimestamp()
                });

                estudianteCard.classList.add('hidden');
                mostrarMensaje(`<i class="fa-solid fa-circle-check"></i> ¡Asistencia marcada para <strong>${estudianteActual.nombres} ${estudianteActual.apellidos}</strong> a las ${horaTexto}!`, 'exito');
                
                buscarForm.reset();
                estudianteActual = null;

            } catch (error) {
                console.error("Error al registrar:", error);
                mostrarMensaje('<i class="fa-solid fa-circle-xmark"></i> Error al guardar asistencia.', 'error');
            } finally {
                btnConfirmarAsistencia.disabled = false;
                btnConfirmarAsistencia.innerHTML = '<i class="fa-solid fa-check-double"></i> Confirmar Marcación';
            }
        });
    </script>
</body>
</html>
