<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CETPRO SAN PEDRO DE APLAO - Listado de Asistencias</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Encabezado -->
    <header class="w-full bg-slate-800 border-b border-slate-700 py-4 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white">CETPRO SAN PEDRO DE APLAO</h1>
                    <p class="text-xs text-indigo-400">Listado de Asistencias Registradas</p>
                </div>
            </div>
            <a href="index.html" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg flex items-center gap-2 transition">
                <i class="fa-solid fa-house"></i> Volver al Inicio
            </a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto w-full p-6 flex-grow space-y-6">
        
        <!-- Filtros y Métricas -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="w-full md:w-1/2 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="inputBuscar" placeholder="Buscar por nombre o apellido..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="flex items-center gap-3 bg-indigo-500/10 border border-indigo-500/30 px-5 py-2.5 rounded-xl text-indigo-300 w-full md:w-auto justify-center">
                <i class="fa-solid fa-user-check text-lg"></i>
                <span class="text-xs font-medium">Total de Asistencias:</span>
                <span id="totalContador" class="text-lg font-bold text-white bg-indigo-600 px-3 py-0.5 rounded-lg">0</span>
            </div>

        </div>

        <!-- Tabla -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase border-b border-slate-700 font-semibold tracking-wider">
                        <tr>
                            <th class="py-4 px-6">DNI (Protegido)</th>
                            <th class="py-4 px-6">Estudiante</th>
                            <th class="py-4 px-6">Programa de Estudios</th>
                            <th class="py-4 px-6">Fecha</th>
                            <th class="py-4 px-6">Hora</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAsistencias" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="5" class="py-8 text-center text-slate-400">
                                <i class="fa-solid fa-circle-notch animate-spin text-xl mb-2 text-indigo-400"></i>
                                <p>Cargando datos desde Firebase...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full bg-slate-950 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-400">
        <p>&copy; CETPRO SAN PEDRO DE APLAO - Todos los derechos reservados.</p>
    </footer>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONEXIÓN A FIREBASE REAL
        const firebaseConfig = {
            apiKey: "AIzaSyAMAVmKSb8Tygvd3NycZMrBj86GN9h4-j4",
            authDomain: "registro-personas-c5e48.firebaseapp.com",
            projectId: "registro-personas-c5e48",
            storageBucket: "registro-personas-c5e48.firebasestorage.app",
            messagingSenderId: "129443873783",
            appId: "1:129443873783:web:9d4575e9ea54ba208e24f2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tablaAsistencias = document.getElementById('tablaAsistencias');
        const inputBuscar = document.getElementById('inputBuscar');
        const totalContador = document.getElementById('totalContador');

        let listaAsistencias = [];

        function enmascararDNI(dni) {
            if (!dni || dni.length < 8) return '********';
            return `${dni.substring(0, 2)}***${dni.substring(5)}`;
        }

        function renderizarTabla(datos) {
            totalContador.textContent = datos.length;

            if (datos.length === 0) {
                tablaAsistencias.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-slate-400">
                            <i class="fa-solid fa-folder-open text-2xl mb-2 text-slate-500"></i>
                            <p>No se encontraron registros de asistencia.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tablaAsistencias.innerHTML = datos.map(item => `
                <tr class="hover:bg-slate-700/30 transition">
                    <td class="py-4 px-6 font-mono text-slate-400">
                        <span class="bg-slate-900 border border-slate-700 px-2 py-1 rounded text-[11px]">
                            ${enmascararDNI(item.dni)}
                        </span>
                    </td>
                    <td class="py-4 px-6 font-medium text-white">
                        ${item.nombres} ${item.apellidos}
                    </td>
                    <td class="py-4 px-6">
                        <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-2.5 py-1 rounded-full text-[11px]">
                            ${item.programa || 'Sin datos'}
                        </span>
                    </td>
                    <td class="py-4 px-6 text-slate-300 font-mono">
                        ${item.fecha || '-'}
                    </td>
                    <td class="py-4 px-6 text-emerald-400 font-mono font-medium">
                        ${item.hora || '-'}
                    </td>
                </tr>
            `).join('');
        }

        // Escuchar asistencias en vivo
        const q = query(collection(db, "asistencias"), orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            listaAsistencias = [];
            snapshot.forEach((doc) => {
                listaAsistencias.push({ id: doc.id, ...doc.data() });
            });
            filtrarYMostrar();
        }, (error) => {
            console.error("Error al cargar datos:", error);
            tablaAsistencias.innerHTML = `
                <tr>
                    <td colspan="5" class="py-8 text-center text-red-400">
                        <i class="fa-solid fa-triangle-exclamation text-xl mb-2"></i>
                        <p>Error de conexión con Firebase Firestore.</p>
                    </td>
                </tr>
            `;
        });

        function filtrarYMostrar() {
            const busqueda = inputBuscar.value.toLowerCase().trim();
            const resultados = listaAsistencias.filter(item => {
                const nombreCompleto = `${item.nombres || ''} ${item.apellidos || ''}`.toLowerCase();
                return nombreCompleto.includes(busqueda);
            });
            renderizarTabla(resultados);
        }

        inputBuscar.addEventListener('input', filtrarYMostrar);
    </script>
</body>
</html>
